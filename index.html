<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Udaan App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Udaan Logo" class="logo" />
    <h1>Udaan App</h1>
    <p class="tagline">Empowering Girls, One Step at a Time</p>
  </header>

  <section class="button-grid">
    <button onclick="openPage('about.html')">About Us</button>
    <button onclick="openPage('chapters.html')">Our Chapters</button>
    <button onclick="openPage('affirmations.html')">Daily Affirmations</button>
    <button onclick="openPage('resources.html')">Resources</button>
    <button onclick="openPage('camp.html')">Join a Camp</button>
    <button onclick="openPage('contact.html')">Contact Us</button>
  </section>

  <section class="chatbox hidden" id="chatbotSection">
    <div id="chatlog"></div>
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button onclick="sendMessage()">Send</button>
  </section>

  <footer>
    <p>© 2025 Udaan App. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
