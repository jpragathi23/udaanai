<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <title>UdaanAI</title>
</head>
<body>
  <div class="app-container">
    <h1 class="title">UdaanAI</h1>
    <div class="category-grid">
      <button onclick="openCategory('scholarships')">Scholarships</button>
      <button onclick="openCategory('exams')">Exams</button>
      <button onclick="openCategory('jobs')">Jobs</button>
      <button onclick="openCategory('internships')">Internships</button>
      <button onclick="openCategory('competitions')">Competitions</button>
      <button onclick="openCategory('schemes')">Schemes</button>
      <button onclick="openCategory('digilocker')">DigiLocker</button>
      <button onclick="openCategory('news')">Educational News</button>
      <button onclick="openChatbot()">Chatbot Assistant 🤖</button>
    </div>

    <div id="subcategories" class="hidden">
      <h2 id="selected-category-name"></h2>
      <button onclick="openGovt()">Government</button>
      <button onclick="openPrivate()">Private</button>
      <button onclick="goBack()">⬅ Back</button>
    </div>

    <div id="details-page" class="hidden">
      <h2 id="details-heading"></h2>
      <div class="links-grid" id="links-container"></div>
      <button onclick="goBack()">⬅ Back</button>
    </div>

    <div class="butterfly"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
