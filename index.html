  <style>
    /* RESET & BODY */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Segoe UI,sans-serif;background:#f5f5ff;color:#333;padding:20px;text-align:center;}
    h1{font-size:2.8rem;color:#6a1b9a;margin-bottom:10px;}
    p.tagline{color:#8e24aa;font-style:italic;margin-bottom:30px;}
    /* BUTTON GRID */
    .button-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:0 10px;}
    .main-btn{padding:18px;font-size:1.05rem;background:linear-gradient(135deg,#ba68c8,#9575cd);color:white;border:none;border-radius:25px;
      cursor:pointer;transition:0.3s;position:relative;overflow:hidden;}
    .main-btn:hover{transform:scale(1.05);box-shadow:0 8px 15px rgba(106,27,154,0.3);}
    /* sub-section hidden initially */
    .sub-section{display:none;flex-direction:column;align-items:center;margin:10px auto;}
    .sub-section button{padding:12px 20px;font-size:0.95rem;margin:5px 0;
      background:#9575cd;border:none;border-radius:8px;color:white;width:90%;max-width:400px;
      transition:0.2s;}
    .sub-section button:hover{background:#7e57c2;}
    /* CHAT STYLE */
    .chat-section{margin-top:40px;max-width:700px;display:inline-block;text-align:left;background:#ffffff;border-radius:15px;
      padding:20px;box-shadow:0 0 15px rgba(106,27,154,0.3);}
    #chatlog{height:200px;overflow-y:auto;border:1px solid #ddd;padding:10px;border-radius:10px;background:#f3e5f5;}
    #userInput{width:70%;padding:12px;border:1px solid #ba68c8;border-radius:8px;margin-right:8px;}
    .chat-section button{padding:12px 18px;background:#7e57c2;color:white;border:none;border-radius:8px;cursor:pointer;}
    .chat-section button:hover{background:#6a1b9a;}
  </style>
</head>

  <!-- CHATBOT -->
  <div class="chat-section">
    <h2>Ask UdaanAI</h2>
    <div id="chatlog"></div>
    <input type="text" id="userInput" placeholder="E.g. I am in 9th class" />
    <button onclick="sendMessage()">Send</button>
  </div>

<script>
  function toggleSection(id){
    document.querySelectorAll('.sub-section').forEach(s=>s.id===id?s.style.display=s.style.display==='flex'?'none':'flex':'none');
  }

  function sendMessage(){
    const inp=document.getElementById('userInput'), log=document.getElementById('chatlog');
    const msg=inp.value.trim();
    if(!msg) return;
    log.innerHTML+=`<div><strong>You:</strong> ${msg}</div>`;
    let resp='Sorry, I didn’t understand. Try: “I am in 9th class”';
    const l=msg.toLowerCase();
    const mapping={
      '9th':'exams: NEET/ JEE in future, scholarships: NMMS, PM schemes for class 9, subjects foundation',
      '5th':'Olympiad, scholarships: NSP pre-matric, schemes: mid-day meals, health checkups',
      '12th':'NEET/ JEE, scholarships: AICTE Pragati, govt schemes for 12th pass',
      'phd':'UGC NET, INSPIRE, research scholarships, govt exams through PhD eligibility',
      'nursery':'mid-day meals scheme, ICDS, early education support in government schemes'
    };
    for(const key in mapping){
      if(l.includes(key)){ resp=`For class ${key}: Recommended → ${mapping[key]}`; break;}
    }
    log.innerHTML+=`<div><strong>UdaanAI:</strong> ${resp}</div>`;
    inp.value=''; log.scrollTop=log.scrollHeight;
  }
</script>
