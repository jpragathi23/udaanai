<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6a11cb" />
  <link rel="manifest" href="manifest.json">
  <title>UdaanAI - Right Info, Right Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Butterfly Logo and Tagline -->
    <header class="hero">
      <img src="butterfly.png" alt="Udaan Butterfly" class="butterfly-fly" />
      <h1>Udaan starts from here - Right Info, Right Time</h1>
      <button id="toggle-theme">🌙</button>
    </header>

    <!-- Main Categories Page -->
    <section id="main-page" class="page">
      <div class="grid">
        <button class="main-btn" onclick="openSubPage('scholarships')">Scholarships</button>
        <button class="main-btn" onclick="openSubPage('exams')">Exams</button>
        <button class="main-btn" onclick="openSubPage('jobs')">Jobs</button>
        <button class="main-btn" onclick="openSubPage('internships')">Internships</button>
        <button class="main-btn" onclick="openSubPage('competitions')">Competitions</button>
        <button class="main-btn" onclick="openSubPage('schemes')">Schemes</button>
        <button class="main-btn" onclick="openSubPage('digilocker')">DigiLocker</button>
        <button class="main-btn" onclick="openSubPage('eduNews')">Educational News</button>
        <button class="main-btn chatbot-btn" onclick="toggleChatbot()">🤖 Ask Udaan</button>
      </div>
    </section>

    <!-- SubPage with Govt & Private -->
    <section id="sub-page" class="page hidden">
      <h2 id="sub-title">Choose Category</h2>
      <div class="grid">
        <button class="sub-btn" onclick="openDetails('govt')">Government</button>
        <button class="sub-btn" onclick="openDetails('private')">Private</button>
        <button onclick="goBack()" class="back-btn">⬅ Back</button>
      </div>
    </section>

    <!-- Detail Page with Subcategories -->
    <section id="detail-page" class="page hidden">
      <h2 id="detail-title">Subcategories</h2>
      <div class="grid" id="details-container"></div>
      <button onclick="goBackToSub()" class="back-btn">⬅ Back</button>
    </section>

    <!-- Chatbot (basic bubble) -->
    <div id="chatbot" class="hidden">
      <h4>Hi! I'm Udaan 🤖</h4>
      <p>Ask me anything about scholarships, exams, etc.</p>
      <input type="text" placeholder="Ask a question..." />
    </div>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
